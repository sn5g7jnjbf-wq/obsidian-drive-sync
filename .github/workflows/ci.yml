name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: obsidian-drive-sync-experimental
          path: |
            main.js
            manifest.json
            styles.css
            google-auth-helper.mjs
            Start-Auth.cmd
            README.md
            LICENSE
            docs/
